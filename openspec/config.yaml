schema: spec-driven

context: |
  GLUniverse Suite (`gluniverse-foundry-modules`) — ONE Foundry VTT package
  (v13+, verified v14) that bundles 27 individually toggleable features behind a
  shared "Etched Glass" UI. ~82k lines of feature JS, ~30k lines of CSS.

  Hard constraints — a proposal that violates any of these is wrong:
  - NO build step, bundler, transpiler, or package.json. The repo IS the
    installed module: Foundry loads `scripts/main.mjs` as native ES modules and
    the CSS/lang files listed in `module.json` directly. Never propose adding a
    dependency, a build pipeline, or a framework.
  - NO test runner. Verification is manual: `node --check` over the sources, JSON
    parse checks, and bespoke `tools/*-check.mjs` scripts per risky subsystem.
    Node is the only interpreter available on the dev box (there is no python3).
  - Everything registers under the single package id `gluniverse-foundry-modules`
    (`SUITE_ID`), because Foundry only allows a package its own id. Isolation
    between features is achieved by KEY-PREFIXING settings and flags (`ct.`,
    `init.`, `ff.`, `stage.`, …) and by PAYLOAD-TAGGING sockets. Never register
    under any other id.
  - `styles/gl-tokens.css` is the single source of truth for `--gl-*` tokens and
    `styles/gl-motion.css` the single `@keyframes` pool. Custom properties and
    keyframe names are global: redeclaring a foundation token or reusing a bare
    `gl-` animation name silently corrupts other features. Route identity through
    `--gl-accent`. Etched Glass is the only theme.
  - Never rename an existing i18n key or CSS class prefix — it breaks migration
    and live world data.
  - The suite deliberately does NOT honor the OS `prefers-reduced-motion`
    preference; animations always play. Do not add such checks.
  - Feature adapters must not register Hooks or open UI at import time; side
    effects belong in `onInit` / `onReady` so disabled features stay inert.

  Binding docs: `docs/FEATURE_CONTRACT.md` (adapter contract, prefix matrix),
  `docs/DESIGN_SYSTEM.md` (token pool, theme contract). Feature-specific:
  `docs/STATBLOCK_FORMAT.md`, `docs/STAGE_LIGHTING.md`, `docs/LOCATIONS.md`.

  The dominant failure mode in this codebase is SILENT failure — a runtime-built
  i18n key with no entry, a colliding `@keyframes`, a shader that degrades to the
  CSS fallback, an event id that renders fine and then ignores every control.
  Prefer changes whose breakage is loud, and add a `tools/*-check.mjs` guard when
  it cannot be.

  Commits follow Conventional Commits, scoped by feature:
  `feat(critical): …`, `fix(clocks-tracker): …`, `chore(release): vX.Y.Z`.

