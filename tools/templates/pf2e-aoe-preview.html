<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Spellglass preview</title>
<link rel="stylesheet" href="__ROOT__/styles/gl-fonts.css">
<link rel="stylesheet" href="__ROOT__/styles/gl-tokens.css">
<script src="https://cdn.jsdelivr.net/npm/pixi.js@7.4.2/dist/pixi.min.js"></script>
<style>
  html, body { margin: 0; height: 100%; }
  body { background: #06080d; color: #eef1f7; font-family: "Oxanium", sans-serif; overflow: hidden; }
  .bar {
    position: fixed; inset: 0 0 auto 0; display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center;
    padding: 10px 16px; background: rgba(11, 15, 23, 0.86); border-bottom: 1px solid rgba(152, 162, 182, 0.18);
    font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; z-index: 2;
  }
  .bar label { display: inline-flex; gap: 6px; align-items: center; color: #98a2b6; }
  .bar select, .bar button, .bar input { font: inherit; color: #eef1f7; }
  .bar select, .bar button {
    background: #161d2c; border: 1px solid rgba(107, 134, 214, 0.45); padding: 4px 9px; border-radius: 2px;
    text-transform: uppercase; letter-spacing: 0.06em; cursor: pointer;
  }
  .bar .title { font-weight: 600; letter-spacing: 0.18em; margin-right: 6px; }
  .readout { margin-left: auto; font-family: "JetBrains Mono", monospace; color: #98a2b6; text-transform: none; letter-spacing: 0; }
  #stage { position: fixed; inset: 0; }
  #tags { position: fixed; inset: 0; pointer-events: none; }
  .tag {
    position: absolute; transform: translate(-50%, 0); white-space: nowrap; text-align: center;
    font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: #eef1f7;
    text-shadow: 0 0 3px #000, 0 0 6px #000;
  }
  .tag small { display: block; color: #98a2b6; letter-spacing: 0.04em; font-family: "JetBrains Mono", monospace; text-transform: none; }
  .err { position: fixed; bottom: 12px; left: 16px; right: 16px; color: #ff4a52; font-family: monospace; white-space: pre-wrap; z-index: 3; }
</style>
</head>
<body>
<div class="bar">
  <span class="title">Spellglass</span>
  <label>Sheet <select id="sheet">
    <option value="functions">12 functions</option>
    <option value="profiles">24 built-in profiles</option>
    <option value="materials">26 materials</option>
    <option value="shapes">shapes &amp; gridless</option>
  </select></label>
  <label>Floor <select id="floor"><option value="dark">dark map</option><option value="bright">bright map</option></select></label>
  <label>Zoom <input id="zoom" type="range" min="0.3" max="1.6" step="0.05" value="0.55"></label>
  <label>Shed <input id="shed" type="range" min="0" max="5" step="1" value="0"></label>
  <label><input id="motion" type="checkbox" checked> Motion</label>
  <button id="replay">Replay entrance</button>
  <button id="pulse">Pulse all</button>
  <span class="readout" id="readout">—</span>
</div>
<div id="stage"></div>
<div id="tags"></div>
<div class="err" id="err"></div>
<script type="module">
const errBox = document.getElementById("err");
const fail = (e) => { errBox.textContent += (e?.stack || e) + "\n"; console.error(e); };
window.addEventListener("error", (e) => fail(e.error || e.message));
window.addEventListener("unhandledrejection", (e) => fail(e.reason));

/* The data adapter reads Foundry's canvas for grid authority. Stand one up
   with exactly the square-grid contract the check tool pins, plus a wall. */
const G = 100;
globalThis.canvas = {
  ready: true,
  dimensions: { size: G, distance: 5 },
  grid: {
    isSquare: true, isGridless: false,
    getCenterPoint: ({ x, y }) => ({ x: Math.floor(x / G) * G + G / 2, y: Math.floor(y / G) * G + G / 2 }),
    getOffset: ({ x, y }) => ({ i: Math.floor(y / G), j: Math.floor(x / G) }),
    getTopLeftPoint: ({ i, j }) => ({ x: j * G, y: i * G }),
  },
};
const walls = [];
globalThis.CONFIG = { Canvas: { polygonBackends: { move: { testCollision: (o, d) => walls.some((w) => w(o, d)) } } } };

const ROOT = "__ROOT__";
const [{ AreaView }, look, data, anim, profiles, schema] = await Promise.all([
  import(`${ROOT}/scripts/features/pf2e-aoe/render/area.mjs`),
  import(`${ROOT}/scripts/features/pf2e-aoe/render/look.mjs`),
  import(`${ROOT}/scripts/features/pf2e-aoe/data.mjs`),
  import(`${ROOT}/scripts/features/pf2e-aoe/anim.mjs`),
  import(`${ROOT}/scripts/features/pf2e-aoe/profiles.mjs`),
  import(`${ROOT}/scripts/features/pf2e-aoe/schema.mjs`),
]);
const { composeLook, FUNCTION_LOOK, MATERIAL_COLORS } = look;
const { AoeAnim } = anim;

const q = new URLSearchParams(location.search);
const $ = (id) => document.getElementById(id);
for (const [id, key] of [["sheet", "sheet"], ["floor", "floor"], ["zoom", "zoom"], ["shed", "shed"]]) if (q.has(key)) $(id).value = q.get(key);
if (q.get("motion") === "0") $("motion").checked = false;

const app = new PIXI.Application({ resizeTo: window, backgroundColor: 0x06080d, antialias: true, autoDensity: true, resolution: devicePixelRatio || 1 });
$("stage").appendChild(app.view);
const world = new PIXI.Container();
app.stage.addChild(world);
const floorLayer = new PIXI.Container(), groundLayer = new PIXI.Container(), tokenLayer = new PIXI.Container(), overLayer = new PIXI.Container();
world.addChild(floorLayer, groundLayer, tokenLayer, overLayer);

/* ---- region fixtures, through the real data adapter ---- */
function region(shape, areaShape, extra = {}) {
  const document = { shapes: [shape], flags: { pf2e: { areaShape } }, elevation: { bottom: 0 }, ...extra };
  const r = { id: Math.random().toString(36).slice(2), document };
  if (shape.type === "rectangle") {
    r._getCoveredGridSpaceOffsets = () => {
      const out = [];
      for (let y = shape.y; y < shape.y + shape.height; y += G) for (let x = shape.x; x < shape.x + shape.width; x += G) out.push({ x, y });
      return out;
    };
    document.bounds = { x: shape.x, y: shape.y, width: shape.width, height: shape.height };
  }
  return r;
}
const burst = (cx, cy, feet) => region({ type: "circle", x: cx, y: cy, radius: feet / 5 * G }, "burst");
const cone = (x, y, feet, rot) => region({ type: "cone", x, y, radius: feet / 5 * G, angle: 90, rotation: rot }, "cone");
const lineR = (x, y, feet, rot, width = 5) => region({ type: "line", x, y, length: feet / 5 * G, width: width / 5 * G, rotation: rot }, "line");
const square = (x, y, n) => region({ type: "rectangle", x, y, width: n * G, height: n * G }, "square");
const emanation = (x, y, size, feet) => region({ type: "emanation", radius: feet / 5 * G, base: { type: "token", x, y, width: size, height: size } }, "emanation");

function bounds(r) {
  const s = r.document.shapes[0];
  if (r.document.bounds) return;
  let b;
  if (s.type === "circle") b = { x: s.x - s.radius, y: s.y - s.radius, width: s.radius * 2, height: s.radius * 2 };
  else if (s.type === "cone" || s.type === "line") { const L = s.radius ?? s.length; b = { x: s.x - L, y: s.y - L, width: L * 2, height: L * 2 }; }
  else if (s.type === "emanation") { const bx = s.base.x, by = s.base.y, w = s.base.width * G, h = s.base.height * G; b = { x: bx - s.radius, y: by - s.radius, width: w + s.radius * 2, height: h + s.radius * 2 }; }
  r.document.bounds = b;
}

/* ---- sheets ---- */
const CELL_W = 9, CELL_H = 9; // squares per showcase slot
function slots(n, cols) {
  return Array.from({ length: n }, (_, i) => ({ x: (i % cols) * CELL_W * G, y: Math.floor(i / cols) * (CELL_H + 2) * G }));
}
const defaultMaterial = { harm: "fire", restore: "vitality", support: "holy", protect: "force", hinder: "mental", control: "arcane",
  conceal: "shadow", terrain: "plant", detect: "light", summon: "spirit", hazard: "metal", neutral: "neutral" };
const defaultBehavior = { harm: "impact", restore: "pulse", support: "sustain", protect: "contain", hinder: "pulse", control: "contain",
  conceal: "linger", terrain: "grow", detect: "sweep", summon: "grow", hazard: "trigger", neutral: "static" };

function sheet(id) {
  walls.length = 0;
  const out = [];
  if (id === "functions" || id === "profiles") {
    const list = id === "functions"
      ? schema.FUNCTIONS.map((fn) => ({ name: fn, sem: { function: fn, material: defaultMaterial[fn], behavior: defaultBehavior[fn] }, appearance: {} }))
      : profiles.BUILTIN_PROFILES.map((p) => ({ name: p.id.slice(8).replaceAll("-", " "), sem: p.semantics, appearance: p.appearance ?? {} }));
    const cols = id === "functions" ? 6 : 8;
    const shapes = ["burst", "cone", "square", "line", "emanation"];
    slots(list.length, cols).forEach((at, i) => {
      const kind = id === "functions" ? "burst" : shapes[i % shapes.length];
      const cx = at.x + 4.5 * G, cy = at.y + 4.5 * G;
      const r = kind === "burst" ? burst(at.x + 4 * G, at.y + 4 * G, 15)
        : kind === "cone" ? cone(at.x + 1 * G, at.y + 1 * G, 30, 45)
        : kind === "square" ? square(at.x + 1.5 * G - G / 2, at.y + 1 * G, 6)
        : kind === "line" ? lineR(at.x + 1 * G, at.y + 4.5 * G, 35, 0, 10)
        : emanation(at.x + 3.5 * G, at.y + 3.5 * G, 2, 10);
      out.push({ r, sem: list[i].sem, appearance: list[i].appearance, tag: list[i].name,
        sub: `${list[i].sem.function} · ${list[i].sem.material} · ${list[i].sem.behavior}`, at, token: [cx, cy] });
    });
    /* A wall through the first slot, so the blocked hatch is on the sheet. */
    walls.push((o, d) => d.x > 5 * G && d.x < 8 * G && d.y < 3 * G && o.x < 5 * G);
  } else if (id === "materials") {
    const mats = Object.keys(MATERIAL_COLORS);
    slots(mats.length, 9).forEach((at, i) => {
      out.push({ r: burst(at.x + 4 * G, at.y + 4 * G, 15), sem: { function: "harm", material: mats[i], behavior: "pulse" },
        appearance: {}, tag: mats[i], sub: MATERIAL_COLORS[mats[i]].join(" "), at, token: null });
    });
  } else {
    const kinds = [
      ["burst 20 ft", burst(4 * G, 4 * G, 20)], ["cone 30 ft", cone(1 * G, 1 * G, 30, 45)],
      ["line 60 × 5 ft", lineR(1 * G, 4.5 * G, 40, 0, 5)], ["emanation 10 ft (large)", emanation(3.5 * G, 3.5 * G, 2, 10)],
      ["square 30 ft", square(1 * G, 1 * G, 6)],
    ];
    slots(kinds.length, 5).forEach((at, i) => {
      const [tag, r] = kinds[i];
      const s = r.document.shapes[0];
      for (const k of ["x", "y"]) if (k in s) s[k] += at[k];
      if (s.base) { s.base.x += at.x; s.base.y += at.y; }
      if (r.document.bounds) { r.document.bounds.x += at.x; r.document.bounds.y += at.y; }
      out.push({ r, sem: { function: ["harm", "hinder", "detect", "protect", "hazard"][i], material: ["fire", "mental", "light", "force", "metal"][i],
        behavior: ["impact", "pulse", "sweep", "contain", "trigger"][i] }, appearance: {}, tag, sub: "", at, token: null });
    });
  }
  for (const item of out) bounds(item.r);
  return out;
}

/* ---- floors: something busy to read the areas against ---- */
function drawFloor(cols, rows, bright) {
  for (const c of floorLayer.removeChildren()) c.destroy();
  const g = new PIXI.Graphics();
  const W = cols * G, H = rows * G;
  g.beginFill(bright ? 0xb9a77f : 0x1d2129); g.drawRect(-G, -G, W + 2 * G, H + 2 * G); g.endFill();
  let s = 7;
  const rnd = () => ((s = (s * 16807) % 2147483647) / 2147483647);
  for (let i = 0; i < cols * rows * 0.9; i++) {
    g.beginFill(bright ? (rnd() > 0.5 ? 0xcdbb92 : 0x9c8a63) : (rnd() > 0.5 ? 0x272c36 : 0x15181e), 0.8);
    g.drawRoundedRect(rnd() * W, rnd() * H, G * (0.3 + rnd() * 1.4), G * (0.3 + rnd() * 1.1), G * 0.1);
    g.endFill();
  }
  g.lineStyle({ width: 1.2, color: bright ? 0x5d5038 : 0x3a4150, alpha: 0.6 });
  for (let x = 0; x <= W; x += G) { g.moveTo(x, 0); g.lineTo(x, H); }
  for (let y = 0; y <= H; y += G) { g.moveTo(0, y); g.lineTo(W, y); }
  floorLayer.addChild(g);
}

let areas = [];
function build() {
  for (const a of areas) a.view.destroy();
  for (const c of tokenLayer.removeChildren()) c.destroy();
  $("tags").innerHTML = "";
  const items = sheet($("sheet").value);
  const cols = Math.max(...items.map((i) => i.at.x)) / G + CELL_W;
  const rows = Math.max(...items.map((i) => i.at.y)) / G + CELL_H + 1;
  drawFloor(cols, rows, $("floor").value === "bright");
  areas = items.map((item, i) => {
    const geometry = data.regionGeometry(item.r);
    const cells = data.regionCells(item.r, geometry);
    const lk = composeLook({ fn: item.sem.function, secondary: item.sem.secondaryFunction, material: item.sem.material,
      accentMaterial: item.sem.accent, behavior: item.sem.behavior, treatment: item.appearance?.treatment, intensity: item.appearance?.intensity ?? "balanced" });
    const view = new AreaView(PIXI, { geometry, cells, look: lk, zoom: Number($("zoom").value) });
    groundLayer.addChild(view.ground);
    overLayer.addChild(view.overlay);
    if (item.token) {
      const t = new PIXI.Graphics();
      t.beginFill(0x2a2f3a); t.lineStyle({ width: 6, color: 0xd9dee8 }); t.drawCircle(0, 0, G * 0.42); t.endFill();
      t.position.set(...item.token);
      tokenLayer.addChild(t);
      if (data.cellStateAt(cells, item.token[0], item.token[1], G) >= 0.75) view.setTokenMarks([[item.token[0] - G / 2, item.token[1] - G / 2, G, G]]);
    }
    const tag = document.createElement("div");
    tag.className = "tag";
    tag.innerHTML = `${item.tag}<small>${item.sub}</small>`;
    $("tags").appendChild(tag);
    return { view, anim: new AoeAnim({ motionScale: 1 }), item, tag, delay: i * 70 };
  });
  layout();
}

function layout() {
  const z = Number($("zoom").value);
  world.scale.set(z);
  world.position.set(30, 70);
  for (const a of areas) {
    const p = world.toGlobal(new PIXI.Point(a.item.at.x + CELL_W * G / 2, a.item.at.y + (CELL_H - 0.2) * G));
    a.tag.style.left = `${p.x}px`;
    a.tag.style.top = `${p.y}px`;
  }
}

let paused = false, clock = 0;
function frame(dt) {
  const motion = $("motion").checked;
  const shed = Number($("shed").value);
  const zoom = Number($("zoom").value);
  for (const a of areas) {
    a.anim.motionScale = motion ? 1 : 0;
    if (!paused) {
      if (a.delay > 0) a.delay -= dt;
      else a.anim.step(dt);
    }
    a.view.update({ time: a.anim.time, enter: a.anim.enter, eased: a.anim.eased, presence: a.anim.presence,
      shock: a.anim.shock, pulse: a.anim.pulseProgress, zoom, shed, still: a.anim.still, motionScale: a.anim.motionScale });
  }
}
let last = performance.now(), acc = 0, frames = 0;
app.ticker.add(() => {
  const now = performance.now();
  const dt = Math.min(100, now - last);
  last = now;
  const t0 = performance.now();
  frame(dt);
  acc += performance.now() - t0; frames++;
  if (frames >= 30) { $("readout").textContent = `${areas.length} areas · update ${(acc / frames).toFixed(2)} ms/frame · PIXI ${PIXI.VERSION}`; acc = 0; frames = 0; }
});

window.__aoeSeek = (ms) => {
  paused = true;
  for (const a of areas) { a.anim.motionScale = 1; a.anim.step(ms); }
  frame(0);
  app.render();
};
window.__aoe = { areas, build };

for (const id of ["sheet", "floor"]) $(id).addEventListener("change", build);
$("zoom").addEventListener("input", layout);
$("replay").addEventListener("click", () => { paused = false; for (const a of areas) a.anim = new AoeAnim({ motionScale: 1 }); });
$("pulse").addEventListener("click", () => { for (const a of areas) a.anim.pulse(); });
addEventListener("resize", layout);
build();
if (q.has("seek")) window.__aoeSeek(Number(q.get("seek")));
</script>
</body>
</html>
